name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Check shell syntax
        run: |
          bash -n install-binary.sh
          bash -n tmux-sentinela.tmux
      - name: Test OpenCode plugin
        run: node --test opencode/tmux-sentinela.test.js
      - name: Test with race detection and coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Report coverage
        shell: bash
        run: |
          go tool cover -html=coverage.out -o coverage.html
          {
            printf '## Go coverage (%s)\n\n```text\n' '${{ matrix.os }}'
            go tool cover -func=coverage.out
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.out
            coverage.html
          retention-days: 14
      - name: Build
        run: go build -o bin/tmux-sentinela .
